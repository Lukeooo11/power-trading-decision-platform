services:
  - type: web
    name: power-trading-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: POWER_TRADING_ENV
        value: production
      - key: POWER_TRADING_CORS_ORIGINS
        value: https://lukeooo11.github.io
      - key: AGENT_ENV
        value: production
      - key: AGENT_PLATFORM_BASE_URL
        value: https://power-trading-api-0902.onrender.com
      - key: AGENT_CORS_ORIGINS
        value: https://lukeooo11.github.io
